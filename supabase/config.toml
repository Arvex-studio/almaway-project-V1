# LOCAL ONLY. This directory is deliberately not linked to any hosted project.
project_id = "almaway-phase-2b-2"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Reproduce the audited broad defaults, then verify explicit migration REVOKEs.
auto_expose_new_tables = true

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
jwt_secret = "env(ALMAWAY_LOCAL_JWT_SECRET)"
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enabled = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local.services.default]
version = "bundled"

[experimental]
stack = true
